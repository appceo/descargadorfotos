<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Fotos desde Excel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        if (typeof XLSX === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
        }
    </script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/50 p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight flex items-center justify-center gap-3">
                <span>📷</span> Descargador de Fotos
            </h1>
            <p class="text-slate-400 mt-2 text-sm">Procesa tu archivo Excel para extraer y descargar automáticamente las fotos organizadas en un paquete ZIP.</p>
        </div>

        <div class="space-y-6">
            <!-- Drop Zone -->
            <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-xl p-8 text-center transition-all duration-300 bg-slate-800/40 hover:bg-slate-800/80 group cursor-pointer">
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden">
                <label for="excelFile" class="cursor-pointer flex flex-col items-center justify-center space-y-3">
                    <div class="w-12 h-12 rounded-full bg-indigo-500/10 flex items-center justify-center group-hover:scale-110 transition-transform duration-200">
                        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-slate-200" id="fileLabel">Haz clic para seleccionar o arrastra un archivo Excel</span>
                        <p class="text-xs text-slate-500 mt-1">Formatos soportados: .xlsx, .xls</p>
                    </div>
                </label>
            </div>

            <!-- Stats -->
            <div id="statsContainer" class="hidden grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-900/50 border border-slate-700/50 rounded-lg p-3">
                    <span class="text-xs text-slate-400 block">Total Filas</span>
                    <span id="statTotal" class="text-lg font-bold text-white">0</span>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/50 rounded-lg p-3">
                    <span class="text-xs text-slate-400 block">Descargadas</span>
                    <span id="statSuccess" class="text-lg font-bold text-emerald-400">0</span>
                </div>
                <div class="bg-slate-900/50 border border-slate-700/50 rounded-lg p-3">
                    <span class="text-xs text-slate-400 block">Errores</span>
                    <span id="statErrors" class="text-lg font-bold text-rose-400">0</span>
                </div>
            </div>

            <!-- Action Button -->
            <button id="processBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg transition duration-200 ease-in-out cursor-pointer disabled:cursor-not-allowed">
                Procesar y Descargar Fotos
            </button>

            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden space-y-2 pt-2">
                <div class="flex justify-between text-sm font-medium">
                    <span id="statusText" class="text-slate-300">Iniciando proceso...</span>
                    <span id="percentageText" class="text-indigo-400 font-bold">0%</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700/50">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                </div>
            </div>

            <!-- Logs / Output -->
            <div id="logContainer" class="hidden border border-slate-700/60 rounded-xl p-4 bg-slate-950 text-xs font-mono text-slate-300 max-h-48 overflow-y-auto space-y-1">
            </div>
        </div>
    </div>

    <script>
        const excelFileInput = document.getElementById('excelFile');
        const fileLabel = document.getElementById('fileLabel');
        const processBtn = document.getElementById('processBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const percentageText = document.getElementById('percentageText');
        const logContainer = document.getElementById('logContainer');
        const statsContainer = document.getElementById('statsContainer');
        const statTotal = document.getElementById('statTotal');
        const statSuccess = document.getElementById('statSuccess');
        const statErrors = document.getElementById('statErrors');

        let selectedFile = null;

        excelFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileLabel.textContent = `Archivo: ${selectedFile.name}`;
                processBtn.disabled = false;
            }
        });

        function addLog(msg, type = 'info') {
            logContainer.classList.remove('hidden');
            const item = document.createElement('div');
            if (type === 'error') item.className = 'text-rose-400 flex items-center gap-1.5';
            else if (type === 'success') item.className = 'text-emerald-400 flex items-center gap-1.5';
            else item.className = 'text-slate-300 flex items-center gap-1.5';
            
            item.textContent = msg;
            logContainer.appendChild(item);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function formatGoogleDriveUrl(url) {
            if (url.includes('drive.google.com/file/d/')) {
                const idMatch = url.match(/\/d\/([^\/]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
                }
            } else if (url.includes('drive.google.com/open?id=')) {
                const idMatch = url.match(/id=([^&]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
                }
            }
            return url;
        }

        async function fetchImageWithProxyFallback(originalUrl) {
            const url = formatGoogleDriveUrl(originalUrl);

            // 1. Intento directo
            try {
                const response = await fetch(url);
                if (response.ok) return await response.blob();
            } catch (err) {}

            // 2. Proxy 1
            try {
                const proxyUrl1 = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const response1 = await fetch(proxyUrl1);
                if (response1.ok) return await response1.blob();
            } catch (err) {}

            // 3. Proxy 2
            try {
                const proxyUrl2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const response2 = await fetch(proxyUrl2);
                if (response2.ok) return await response2.blob();
            } catch (err) {}

            throw new Error("No se pudo acceder al enlace (Verifica permisos de acceso/público)");
        }

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            if (typeof XLSX === 'undefined') {
                addLog("Error: La librería XLSX no está lista. Por favor recarga la página.", "error");
                return;
            }

            processBtn.disabled = true;
            excelFileInput.disabled = true;
            progressContainer.classList.remove('hidden');
            statsContainer.classList.remove('hidden');
            logContainer.innerHTML = '';
            
            let successCount = 0;
            let errorCount = 0;

            addLog("Leyendo archivo Excel...");

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convertir a JSON
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (jsonRows.length === 0) {
                        addLog("El archivo Excel está vacío o no tiene un formato válido.", "error");
                        return;
                    }

                    const zip = new JSZip();
                    const totalRows = jsonRows.length;
                    statTotal.textContent = totalRows;

                    for (let i = 0; i < totalRows; i++) {
                        const row = jsonRows[i];
                        const progress = Math.round(((i + 1) / totalRows) * 100);
                        
                        progressBar.style.width = `${progress}%`;
                        percentageText.textContent = `${progress}%`;
                        statusText.textContent = `Procesando fila ${i + 1} de ${totalRows}...`;

                        // Extraer valores de la fila
                        const keys = Object.keys(row);
                        let nameParts = [];
                        let doc = "";
                        let url = "";

                        keys.forEach(k => {
                            const val = String(row[k] || '').trim();
                            const keyLower = k.toLowerCase();

                            if (val.toLowerCase().startsWith('http')) {
                                url = val;
                            } else if (keyLower.includes('doc') || keyLower.includes('cedula') || keyLower.includes('id')) {
                                doc = val;
                            } else if (val !== "") {
                                nameParts.push(val);
                            }
                        });

                        // Si no encontró URL por clave, buscar cualquier celda con http
                        if (!url) {
                            for (let k of keys) {
                                const val = String(row[k] || '').trim();
                                if (val.toLowerCase().startsWith('http')) {
                                    url = val;
                                    break;
                                }
                            }
                        }

                        if (!url) {
                            addLog(`Fila ${i + 1}: Omitida (No se encontró ningún enlace HTTP)`, "info");
                            continue;
                        }

                        // Filtrar el nombre quitando la URL y el Documento
                        let cleanNameParts = nameParts.filter(p => p !== url && p !== doc);
                        let base = cleanNameParts.join('_').replace(/\s+/g, '_');
                        
                        while (base.includes('__')) {
                            base = base.replace(/__/g, '_');
                        }
                        base = base.replace(/^_+|_+$/g, '');

                        if (!base) base = `Registro_${i + 1}`;

                        let ext = ".jpg";
                        const lowerUrl = url.toLowerCase();
                        if (lowerUrl.includes('.pdf')) ext = ".pdf";
                        else if (lowerUrl.includes('.png')) ext = ".png";
                        else if (lowerUrl.includes('.jpeg')) ext = ".jpeg";

                        const filename = doc ? `${base}_${doc}${ext}` : `${base}${ext}`;

                        try {
                            const blob = await fetchImageWithProxyFallback(url);
                            zip.file(filename, blob);
                            successCount++;
                            statSuccess.textContent = successCount;
                            addLog(`✔ Guardado: ${filename}`, "success");
                        } catch (err) {
                            errorCount++;
                            statErrors.textContent = errorCount;
                            addLog(`✖ Error fila ${i + 1}: ${err.message}`, "error");
                        }
                    }

                    if (successCount > 0) {
                        statusText.textContent = "Generando paquete ZIP...";
                        addLog("Empaquetando fotos en el archivo ZIP...");
                        const zipContent = await zip.generateAsync({ type: "blob" });
                        saveAs(zipContent, "Fotos_Apellido_Nombre.zip");
                        statusText.textContent = "¡Completado!";
                        addLog(`✔ Proceso terminado: ${successCount} fotos empaquetadas con éxito.`, "success");
                    } else {
                        statusText.textContent = "Sin descargas exitosas.";
                        addLog("No se pudo descargar ninguna imagen. Comprueba que los links sean públicos.", "error");
                    }

                } catch (err) {
                    addLog(`Error al leer el archivo: ${err.message}`, "error");
                } finally {
                    processBtn.disabled = false;
                    excelFileInput.disabled = false;
                }
            };

            reader.readAsArrayBuffer(selectedFile);
        });
    </script>
</body>
</html>
