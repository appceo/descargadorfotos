<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Fotos desde Google Sheets</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-file-csv text-3xl text-emerald-400"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Extractor de Fotos - Google Sheets</h1>
                    <p class="text-xs text-indigo-200">Formato: APELLIDO 1_APELLIDO 2_Nombre 1_Nombre 2.jpg</p>
                </div>
            </div>
            <button id="btnReload" class="bg-indigo-500 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center space-x-1">
                <i class="fa-solid fa-rotate"></i>
                <span>Sincronizar Google Sheets</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">

        <!-- Controls Bar -->
        <div id="controlsBar" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Buscar persona..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="text-xs text-slate-500 font-medium whitespace-nowrap" id="statsCount">
                    Cargando datos...
                </div>
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                <button id="btnDownloadZip" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-4 py-2 rounded-lg shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-zipper text-base"></i>
                    <span>Descargar Todo (.ZIP)</span>
                </button>
            </div>
        </div>

        <!-- Progress Spinner -->
        <div id="loader" class="flex flex-col items-center justify-center py-12 bg-white rounded-xl border border-slate-200 shadow-sm p-6">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600 mb-3"></i>
            <p class="text-slate-700 font-semibold text-sm" id="loaderText">Conectando con Google Sheets...</p>
        </div>

        <!-- Grid Results -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-xl border border-slate-200 p-8">
            <i class="fa-solid fa-circle-exclamation text-5xl text-amber-400 mb-3"></i>
            <h3 class="text-base font-semibold text-slate-600">No se encontraron datos</h3>
            <p class="text-xs text-slate-400 mt-1">Asegúrate de que la Hoja de Google tenga permisos públicos de lectura.</p>
        </div>
    </main>

    <script>
        const SHEET_ID = '1k3p0YhVaFlGYwpUwo5k4pS28oW4h29HKqWOxFh2HE_k';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        let processedRecords = [];

        const resultsGrid = document.getElementById('resultsGrid');
        const emptyState = document.getElementById('emptyState');
        const statsCount = document.getElementById('statsCount');
        const searchInput = document.getElementById('searchInput');
        const btnDownloadZip = document.getElementById('btnDownloadZip');
        const btnReload = document.getElementById('btnReload');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');

        document.addEventListener('DOMContentLoaded', fetchGoogleSheetData);
        btnReload.addEventListener('click', fetchGoogleSheetData);

        async function fetchGoogleSheetData() {
            showLoader('Obteniendo información de Google Sheets...');
            processedRecords = [];

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('No se pudo acceder a la Hoja de Google.');
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    hideLoader();
                    emptyState.classList.remove('hidden');
                    return;
                }

                const headers = rows[0].map(h => cleanStr(h).toUpperCase());
                
                const idxA1 = headers.findIndex(h => h.includes('APELLIDO 1') || h.includes('APELLIDO1'));
                const idxA2 = headers.findIndex(h => h.includes('APELLIDO 2') || h.includes('APELLIDO2'));
                const idxN1 = headers.findIndex(h => h.includes('NOMBRE 1') || h.includes('NOMBRE1'));
                const idxN2 = headers.findIndex(h => h.includes('NOMBRE 2') || h.includes('NOMBRE2'));
                const idxFoto = headers.findIndex(h => h.includes('FOTO') || h.includes('IMAGEN') || h.includes('URL'));

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const a1 = cleanStr(idxA1 !== -1 ? row[idxA1] : '');
                    const a2 = cleanStr(idxA2 !== -1 ? row[idxA2] : '');
                    const n1 = cleanStr(idxN1 !== -1 ? row[idxN1] : '');
                    const n2 = cleanStr(idxN2 !== -1 ? row[idxN2] : '');
                    let rawFoto = idxFoto !== -1 ? cleanStr(row[idxFoto]) : '';

                    if (!a1 && !a2 && !n1 && !n2 && !rawFoto) continue;

                    const fullNameParts = [a1, a2, n1, n2].filter(Boolean);
                    const formattedFilename = fullNameParts.length > 0 
                        ? fullNameParts.join('_') 
                        : `Registro_${i}`;

                    const displayName = `${a1} ${a2} ${n1} ${n2}`.trim() || `Persona ${i}`;
                    
                    // Convertir link de Drive a vista previa directa si aplica
                    let processedPhotoUrl = formatPhotoUrl(rawFoto);

                    processedRecords.push({
                        id: i,
                        a1, a2, n1, n2,
                        filename: `${formattedFilename}.jpg`,
                        photoUrl: processedPhotoUrl,
                        displayName: displayName,
                        base64Data: null
                    });
                }

                // Ordenar por APELLIDO 1
                processedRecords.sort((a, b) => a.a1.localeCompare(b.a1, 'es', { sensitivity: 'base' }));

                renderGrid(processedRecords);
                // Precargar imágenes en segundo plano para permitir exportación en ZIP
                preloadImagesBase64();

            } catch (error) {
                console.error(error);
                emptyState.classList.remove('hidden');
                alert('Ocurrió un error al cargar la hoja de Google Sheets. Revisa que el enlace sea público.');
            } finally {
                hideLoader();
            }
        }

        function formatPhotoUrl(url) {
            if (!url) return null;
            let src = url.trim();

            if (src.includes('drive.google.com')) {
                const idMatch = src.match(/\/d\/([^\/]+)/) || src.match(/id=([^&]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }
            }
            return src;
        }

        async function preloadImagesBase64() {
            for (let rec of processedRecords) {
                if (rec.photoUrl && !rec.base64Data) {
                    try {
                        const base64 = await fetchImageAsBase64(rec.photoUrl);
                        if (base64) rec.base64Data = base64;
                    } catch (e) {
                        console.warn('No se pudo convertir la imagen a base64:', rec.photoUrl);
                    }
                }
            }
        }

        async function fetchImageAsBase64(url) {
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    if (res.ok) {
                        const blob = await res.blob();
                        return await blobToBase64(blob);
                    }
                } catch (e) {
                    continue;
                }
            }
            return null;
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(blob);
            });
        }

        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = text[i - 1];
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') r.push(row);
            return r;
        }

        function cleanStr(str) {
            return String(str || '').trim();
        }

        function renderGrid(records) {
            resultsGrid.innerHTML = '';

            if (records.length === 0) {
                emptyState.classList.remove('hidden');
                statsCount.textContent = `0 registros`;
                return;
            }

            emptyState.classList.add('hidden');
            statsCount.textContent = `${records.length} registro(s) procesados`;

            records.forEach(rec => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between';

                const imgContainer = document.createElement('div');
                imgContainer.className = 'w-full h-48 bg-slate-100 flex items-center justify-center overflow-hidden relative border-b border-slate-100';

                if (rec.photoUrl) {
                    const img = document.createElement('img');
                    img.src = rec.photoUrl;
                    img.alt = rec.displayName;
                    img.className = 'w-full h-full object-cover';
                    img.onerror = () => {
                        imgContainer.innerHTML = `<div class="text-center p-4 text-slate-400">
                            <i class="fa-regular fa-image text-3xl mb-1 text-slate-300"></i>
                            <p class="text-xs">Error de carga de imagen</p>
                        </div>`;
                    };
                    imgContainer.appendChild(img);
                } else {
                    imgContainer.innerHTML = `<div class="text-center p-4 text-slate-400">
                        <i class="fa-regular fa-image text-3xl mb-1"></i>
                        <p class="text-xs">Sin foto en Google Sheets</p>
                    </div>`;
                }

                const infoBox = document.createElement('div');
                infoBox.className = 'p-4 flex-grow flex flex-col justify-between';

                infoBox.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm truncate" title="${rec.displayName}">${rec.displayName}</h4>
                        <p class="text-xs font-mono text-indigo-600 font-semibold mt-0.5 truncate" title="${rec.filename}">${rec.filename}</p>
                    </div>
                `;

                const btnDownload = document.createElement('button');
                btnDownload.className = `mt-3 w-full text-xs font-medium py-2 rounded-lg flex items-center justify-center space-x-2 transition ${
                    rec.photoUrl 
                        ? 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700' 
                        : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                }`;
                btnDownload.disabled = !rec.photoUrl;
                btnDownload.innerHTML = `<i class="fa-solid fa-download"></i> <span>Descargar Foto</span>`;
                
                if (rec.photoUrl) {
                    btnDownload.addEventListener('click', async () => {
                        if (rec.base64Data) {
                            saveAs(rec.base64Data, rec.filename);
                        } else {
                            const b64 = await fetchImageAsBase64(rec.photoUrl);
                            if (b64) {
                                rec.base64Data = b64;
                                saveAs(b64, rec.filename);
                            } else {
                                window.open(rec.photoUrl, '_blank');
                            }
                        }
                    });
                }

                infoBox.appendChild(btnDownload);
                card.appendChild(imgContainer);
                card.appendChild(infoBox);
                resultsGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = processedRecords.filter(r => 
                r.displayName.toLowerCase().includes(term) || 
                r.filename.toLowerCase().includes(term)
            );
            renderGrid(filtered);
        });

        // DESCARGA ZIP
        btnDownloadZip.addEventListener('click', async () => {
            const validRecords = processedRecords.filter(r => r.photoUrl);
            
            if (validRecords.length === 0) {
                alert('No hay fotos disponibles para descargar.');
                return;
            }

            showLoader('Generando paquete ZIP...');
            
            const zip = new JSZip();
            let addedCount = 0;

            for (let rec of validRecords) {
                let base64 = rec.base64Data || await fetchImageAsBase64(rec.photoUrl);
                if (base64) {
                    const parts = base64.split(',');
                    if (parts.length === 2) {
                        zip.file(rec.filename, parts[1], { base64: true });
                        addedCount++;
                    }
                }
            }

            if (addedCount === 0) {
                hideLoader();
                alert('No se pudieron descargar los binarios de las fotos. Comprueba los permisos de lectura de Google Drive.');
                return;
            }

            try {
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "Fotos_GoogleSheets.zip");
            } catch (e) {
                console.error(e);
                alert("Error al comprimir el archivo ZIP.");
            } finally {
                hideLoader();
            }
        });

        function showLoader(msg) {
            loaderText.textContent = msg;
            loader.classList.remove('hidden');
            loader.classList.add('flex');
        }

        function hideLoader() {
            loader.classList.add('hidden');
            loader.classList.remove('flex');
        }
    </script>
</body>
</html>
